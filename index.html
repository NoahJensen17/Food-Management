<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Meal Planner" />
  <meta name="theme-color" content="#f65810" />
</head>
<body>
  <div class="install-overlay" id="install-overlay">
    <div class="install-card">
      <div class="install-card__header">
        <button class="install-close" id="install-close" aria-label="Close">&times;</button>
        <img class="install-card__icon" src="icons/icon-192.png" alt="" width="72" height="72" />
        <div class="install-card__name">Meal Planner</div>
        <div class="install-card__sub">Add to your home screen</div>
      </div>
      <div id="install-steps"></div>
      <div class="install-card__footer">
        <div id="step-dots"></div>
        <button class="install-btn install-btn--ghost" id="install-prev">Back</button>
        <button class="install-btn" id="install-next">Next</button>
      </div>
    </div>
  </div>

  <div class="install-bar" id="install-bar">
    <img src="icons/icon-192.png" alt="" width="26" height="26" />
    <span class="install-bar__text">Install <strong>Meal Planner</strong> for quick access</span>
    <button class="install-btn install-btn--ghost install-btn--sm" id="install-later">Later</button>
    <button class="install-btn install-btn--sm" id="install-open">Install</button>
  </div>

  <div class="phone-frame">
    <header class="app-header">
      <div class="app-header__title" id="header-title">Home</div>
      <div class="app-header__actions" id="header-actions"></div>
    </header>

    <main id="main-content">
      <section class="view" id="view-home"></section>
      <section class="view" id="view-recipes"></section>
      <section class="view" id="view-planning"></section>
      <section class="view" id="view-shopping"></section>
    </main>

    <div class="overlay" id="recipe-overlay">
      <div class="overlay-panel" id="recipe-overlay-panel"></div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-item" data-view="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-view="recipes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6c-2-1.5-5-2-9-2v14c4 0 7 .5 9 2 2-1.5 5-2 9-2V4c-4 0-7 .5-9 2z"/><path d="M12 6v14"/><path d="M5.5 8c1.5 0 3 .2 4.5.8M5.5 11c1.5 0 3 .2 4.5.8M5.5 14c1.5 0 3 .2 4.5.8M14 8.8c1.5-.6 3-.8 4.5-.8M14 11.8c1.5-.6 3-.8 4.5-.8M14 14.8c1.5-.6 3-.8 4.5-.8"/></svg>
        <span>Recipes</span>
      </button>
      <button class="nav-item" data-view="shopping">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span>List</span>
      </button>
      <button class="nav-item" data-view="planning">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>Planning</span>
      </button>
    </nav>
  </div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views/cat.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/recipes.js"></script>
  <script src="js/views/planning.js"></script>
  <script src="js/views/shopping.js"></script>
  <script src="js/app.js"></script>
  <script src="js/install.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
