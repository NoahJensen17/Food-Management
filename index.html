<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f65810" />
</head>
<body>
  <div class="phone-frame">
    <header class="app-header">
      <div class="app-header__title" id="header-title">Home</div>
      <div class="app-header__actions" id="header-actions"></div>
    </header>

    <main id="main-content">
      <section class="view" id="view-home"></section>
      <section class="view" id="view-recipes"></section>
      <section class="view" id="view-planning"></section>
      <section class="view" id="view-shopping"></section>
    </main>

    <div class="overlay" id="recipe-overlay">
      <div class="overlay-panel" id="recipe-overlay-panel"></div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-item" data-view="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-view="recipes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3v7a3 3 0 1 0 3 0V3M15 3v7M18 3v7"/><path d="M8 3v6a2 2 0 0 1-2 2v0a2 2 0 0 1-2-2V3"/><path d="M6 11v10"/></svg>
        <span>Recipes</span>
      </button>
      <button class="nav-item" data-view="shopping">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span>List</span>
      </button>
      <button class="nav-item" data-view="planning">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>Planning</span>
      </button>
    </nav>
  </div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/recipes.js"></script>
  <script src="js/views/planning.js"></script>
  <script src="js/views/shopping.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
