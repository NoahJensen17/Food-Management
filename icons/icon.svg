<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a2e"/>
      <stop offset="1" stop-color="#f65810"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#8a3209" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Notepad -->
  <g transform="rotate(-6 256 256)" filter="url(#shadow)">
    <rect x="146" y="112" width="210" height="262" rx="20" fill="#ffffff"/>
    <rect x="146" y="112" width="210" height="44" rx="20" fill="#ffe4d3"/>
    <rect x="146" y="136" width="210" height="20" fill="#ffe4d3"/>
    <!-- Handwriting (written lines) -->
    <path d="M174 200 q10 -14 20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#f65810" stroke-width="8" stroke-linecap="round"/>
    <path d="M174 238 q10 -14 20 0 t20 0 t20 0 t20 0" fill="none" stroke="#f65810" stroke-width="8" stroke-linecap="round"/>
    <!-- Empty ruled lines -->
    <path d="M174 276 H328 M174 314 H328 M174 352 H290" stroke="#fdbc9f" stroke-width="7" stroke-linecap="round"/>
    <!-- Spiral binding -->
    <g fill="#ac3e0b">
      <rect x="170" y="98" width="14" height="34" rx="7"/>
      <rect x="205" y="98" width="14" height="34" rx="7"/>
      <rect x="240" y="98" width="14" height="34" rx="7"/>
      <rect x="275" y="98" width="14" height="34" rx="7"/>
      <rect x="310" y="98" width="14" height="34" rx="7"/>
    </g>
  </g>

  <!-- Carrot writing on the pad -->
  <g transform="translate(238 316) rotate(35)" filter="url(#shadow)">
    <!-- leaves -->
    <g stroke="#ffffff" stroke-width="6" stroke-linejoin="round">
      <path d="M0 -186 Q-34 -216 -22 -252 Q-4 -232 0 -186Z" fill="#3f9b3a"/>
      <path d="M0 -186 Q4 -226 30 -250 Q34 -214 0 -186Z" fill="#53b04a"/>
      <path d="M0 -186 Q-8 -232 6 -262 Q18 -230 0 -186Z" fill="#2f8a30"/>
    </g>
    <!-- body -->
    <path d="M0 0 L-27 -150 Q-29 -192 0 -194 Q29 -192 27 -150Z" fill="#ff9a2e" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
    <!-- ridges -->
    <path d="M-17 -150 H-3 M5 -118 H19 M-15 -88 H-1 M3 -58 H13" stroke="#d9650a" stroke-width="5" stroke-linecap="round"/>
    <!-- highlight -->
    <path d="M-14 -170 L-9 -110" stroke="#ffc680" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
